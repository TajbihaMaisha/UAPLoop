{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8 col-lg-6">
<div class="card">
  <div class="card-body">
    <h2>Edit listing</h2>
    <p>If you change anything, your listing is hidden until the admin approves it again.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-primary" type="submit">Save changes</button>
        <a class="btn btn-outline-secondary" href="{% url 'my_listings' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
</div>
</div>
{% endblock %}
