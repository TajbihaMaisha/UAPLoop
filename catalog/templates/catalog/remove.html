{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8 col-lg-6">
<div class="card">
  <div class="card-body">
    <h2>Remove "{{ listing.title }}"?</h2>
    <p>Are you sure? This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Yes, remove</button>
      <a class="btn btn-secondary" href="{% url 'my_listings' %}">Cancel</a>
    </form>
  </div>
</div>
</div>
</div>
{% endblock %}
