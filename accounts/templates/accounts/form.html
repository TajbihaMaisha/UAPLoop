{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8 col-lg-6">
<div class="card">
  <div class="card-body">
    <h2>{{ title }}</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">{{ button }}</button>
    </form>
  </div>
</div>
</div>
</div>
{% endblock %}
